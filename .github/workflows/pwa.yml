name: PWA verification and releases
on:
  pull_request:
    paths: ['web/**', '.github/workflows/**']
  push:
    branches: [main]
    tags: ['v0.*']
    paths: ['web/**', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'fiukewhfkje/GradeViewer'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    timeout-minutes: 10
    env:
      GRADEVIEWER_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check preinstalled browser compatibility
        run: node -e "if(require('playwright-core/package.json').version !== '1.64.1') throw new Error('Update the Playwright CI image to match package-lock.json')"
      - name: Build, unit and browser checks
        if: matrix.browser == 'chromium'
        run: |
          npm test &
          unit_pid=$!
          result=0
          npm run build && npm run test:e2e || result=1
          wait "$unit_pid" || result=1
          exit "$result"
      - run: npm run build
        if: matrix.browser == 'webkit'
      - run: npm run test:e2e
        if: matrix.browser == 'webkit'
      - run: npx wrangler deploy --dry-run --outdir .local-test/production
        if: matrix.browser == 'chromium'
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-${{ matrix.browser }}
          path: web/.local-test/e2e*/*.png
          include-hidden-files: true
  release-verification:
    if: github.repository == 'fiukewhfkje/GradeViewer' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run release:package
        working-directory: web
      - uses: actions/attest-build-provenance@v3
        id: provenance
        with:
          subject-path: web/release/manifest.json
      - name: Verify real workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify web/release/manifest.json
          --repo fiukewhfkje/GradeViewer
          --bundle "${{ steps.provenance.outputs.bundle-path }}"
          --signer-workflow fiukewhfkje/GradeViewer/.github/workflows/pwa.yml
          --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
  release:
    if: startsWith(github.ref, 'refs/tags/v0.') && github.repository == 'fiukewhfkje/GradeViewer'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Both browser jobs already built/type-checked this exact tagged source.
      # The published artifact contains source, and packaging uses only Node.
      - run: npm run release:package
        working-directory: web
      - uses: actions/attest-build-provenance@v3
        id: provenance
        with:
          subject-path: web/release/manifest.json
      - run: cp "${{ steps.provenance.outputs.bundle-path }}" web/release/provenance.json
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/publish-release.mjs
