name: PWA verification and releases
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        env:
          PWA_PARITY_OUTPUT: web/.local-test/native-parity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && node scripts/verify-native-parity.mjs
        working-directory: web
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    env:
      GRADEVIEWER_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
      - run: npx wrangler deploy --dry-run --outdir .local-test/production
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-${{ matrix.browser }}
          path: web/.local-test/e2e*/*.png
  release:
    if: startsWith(github.ref, 'refs/tags/v0.') && github.repository == 'fiukewhfkje/GradeViewer'
    needs: [verify, native-reference]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build && npm run release:package
        working-directory: web
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web/release/gradeviewer-source.json web/release/manifest.json web/release/manifest.sig --verify-tag --generate-notes --title "GradeViewer $GITHUB_REF_NAME"
