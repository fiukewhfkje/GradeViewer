name: GradeViewer
options:
  bundleIdPrefix: org.gradeviewer
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '7'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  GradeCore:
    path: .
targets:
  GradeViewer:
    type: application
    platform: iOS
    sources:
      - GradeViewer
    dependencies:
      - package: GradeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRADEVIEWER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    info:
      path: GradeViewer/Info.plist
      properties:
        CFBundleDisplayName: GradeViewer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
  GradeViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GradeViewerTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRADEVIEWER_BUNDLE_ID)Tests
    dependencies:
      - target: GradeViewer
      - package: GradeCore
  GradeViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GradeViewerUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GRADEVIEWER_BUNDLE_ID)UITests
    dependencies:
      - target: GradeViewer
schemes:
  GradeViewer:
    build:
      targets:
        GradeViewer: all
    test:
      targets: [GradeViewerTests, GradeViewerUITests]
